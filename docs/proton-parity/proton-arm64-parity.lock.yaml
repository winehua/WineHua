# FEX 版本关系（已核对，勿当 fast-forward）
fex_matrix:
  baseline_86ff33bbe:
    describe: FEX-2605-2-g86ff33bbe
    source_windows_dirs: [ARM64EC, Common, Defs, WOW64, include]
    has_unixlib_dir: false
    has_FEXUnixLib_cpp: false
    produces_unixlib_so: false
  reference_1cc4b93e:
    describe: FEX-2607
    source_windows_dirs: [ARM64EC, Common, Defs, WOW64, UnixLib, include]
    has_unixlib_dir: true
    has_FEXUnixLib_cpp: true
    produces_unixlib_so: true
  merge_base: a04b0241c2fe3911729842205cd8643981108aad
  ancestor_relation: divergent      # 86ff33bbe 不是 1cc4b93e 的祖先
  commits_on_reference_side: 321
  unixlib_backport_commits:
    # 引入 UnixLib 的 6 个提交；已实测可在 86ff33bbe 上无冲突 cherry-pick
    # 并已落地为 scripts/patches/fex-unixlib-backport.patch (commit bba5d2e)
    - 126bcd365  # winternl: Update enums (MemoryWineLoad*/Unload)
    - dbaf22372  # Windows: Adds empty Linux side unix library
    - c09225f86  # Windows: Load unixlib if possible
    - 201bb7398  # Windows/UnixLib: Adds support for Hardware TSO support
    - 954581c75  # Windows/UnixLib: Adds remaining helpers
    - 6c58fef22  # Windows/UnixLib: Fix loading with new MemoryWineLoadUnixLibByName mechanism
  nested_submodule_pins_differ: false   # 两个版本 .gitmodules 无差异
  implication: >
    切换 FEX 版本不是快进合并。要么把 1cc4b93e 的 UnixLib / 接口增量
    按最小集合回移到 86ff33bbe 链路，要么整体切到 1cc4b93e 并接受
    Wine 侧接口变量一并变化。两条路都必须记录对比变量。

# 对齐目标（本轮不追求"全部升级"）
scope:
  do:
    - 在隔离 build/install/package/prefix 目录内做实验
    - 建立可观测的 FEX 统计与 UnixLib 加载证据
    - x86 与 x64 分开测量，不外推
  do_not:
    - 不整体套用第三方 OHOS 补丁
    - 不同时升级 DXVK / vkd3d / Mesa / virglrenderer
    - 不修改产品主线分支
    - 不把 32 位结果外推为 x64 ARM64EC 收益

build_parameters_reference:
  # 来自方案 §5.2/§5.3，用作对照，不是"必须照抄"
  fex_cmake:
    ENABLE_FEXCORE_PROFILER: true
    CMAKE_BUILD_TYPE: Release
    ENABLE_LTO: false
    BUILD_TESTING: false
    TUNE_CPU: none
    RANGES_NATIVE: false
  fex_config_json:
    ProfileStats: "1"
    X87ReducedPrecision: "1"
    TSOEnabled: "1"
    VectorTSOEnabled: "0"
    MemcpySetTSOEnabled: "0"
    HalfBarrierTSOEnabled: "1"
    MaxInst: "500"
    Multiblock: "1"
  local_current:
    cmake_build_type: RelWithDebInfo
    config_json_present: false
    note: 本地仓库内不存在 FEX 配置文件
