# .github/workflows/build.yml
name: Build HAP (arm64-v8a, unsigned)

on:
  push:
    branches:
      - master
      - main-ui
    tags:
      - 'dev-*'                 # 开发版 (直接发布, 不占 Latest 徽章)
      - 'rc-*'                  # RC 版 (占 Latest 徽章)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (dev-xx / rc-xx, 留空则只构建不发布)'
        required: false
        type: string

# GITHUB_TOKEN 权限:
#   contents: write — 拉源码 + 发布 Release (需要 write)
#   packages: read  — 拉 GHCR 私有 buildenv 镜像
permissions:
  contents: write
  packages: read

jobs:
  build:
    name: make NATIVE_ARCH=arm64-v8a hap
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    # 容器里默认 shell 是 sh, 不认 `set -o pipefail` 等 bash 语法
    # 这里强制所有 run step 用 bash
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/panedioic/winehua-buildenv:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ---- 让私有 submodule 走 HTTPS + GITHUB_TOKEN ----
      # 前提: wine/box64/mesa-ohos 三个私有 submodule 与本仓库在同一账号/组织下
      # 若跨组织, 需替换成有跨仓库权限的 PAT (存到 secrets.SUBMODULE_PAT)
      - name: Configure git for private submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "git@github.com:"
          git config --global --add \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # actions/checkout recursive + fetch-depth:1 有时不会把 vkd3d-proton
      # 的嵌套 Khronos/dxil-spirv 子模块落到工作树, 构建脚本会在 1 秒内退出.
      - name: Ensure nested graphics submodules
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          test -f thirdparty/dxvk-modern/include/vulkan/include/vulkan/vulkan.h
          test -f thirdparty/dxvk-modern/include/spirv/include/spirv/unified1/spirv.hpp
          test -f thirdparty/vkd3d-proton/subprojects/Vulkan-Headers/include/vulkan/vulkan.h
          test -f thirdparty/vkd3d-proton/subprojects/SPIRV-Headers/include/spirv/unified1/spirv.h
          test -f thirdparty/vkd3d-proton/subprojects/dxil-spirv/meson.build
          git -C thirdparty/vkd3d-proton submodule status
          git -C thirdparty/vkd3d-proton status --porcelain --untracked-files=no --ignore-submodules=dirty || true

      # ---- 绕过签名: 用 stub 替换 sign.py ----
      # scripts/package.sh 最后会调 `python3 sign.py <unsigned> <signed>`,
      # 无签名场景下这里直接把 unsigned 拷成 "signed" 文件, 让 make hap 完整跑完
      - name: Stub sign.py (unsigned build)
        run: |
          cat > sign.py <<'PY'
          #!/usr/bin/env python3
          # CI-only stub: 无签名构建, 直接把 unsigned HAP 拷贝为 "signed" 输出
          import shutil, sys, os
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          shutil.copy(src, dst)
          print(f"[sign-stub] copied {src} -> {dst} (UNSIGNED)")
          PY
          chmod +x sign.py

      # ---- CI-only: 无签名的 build-profile.json5 ----
      # 从 example 派生会踩坑: example 里的 signingConfigs 指向占位符路径,
      # hvigor 的 SignHap 任务会校验这些文件存在, 直接失败.
      # 这里显式写一份 signingConfigs 为空的 profile, 让 hvigor 跳过 SignHap,
      # 直接输出 entry-default-unsigned.hap.
      - name: Provision unsigned build-profile.json5
        run: |
          cat > build-profile.json5 <<'JSON5'
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "targetSdkVersion": "6.1.0(23)",
                  "compatibleSdkVersion": "6.1.0(23)",
                  "runtimeOS": "HarmonyOS",
                  "buildOption": {
                    "nativeCompiler": "BiSheng",
                    "strictMode": {
                      "caseSensitiveCheck": true,
                      "useNormalizedOHMUrl": true
                    }
                  }
                }
              ],
              "buildModeSet": [
                {
                  "name": "debug"
                },
                {
                  "name": "release"
                }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  {
                    "name": "default",
                    "applyToProducts": ["default"]
                  }
                ]
              }
            ]
          }
          JSON5
          echo "[ci] wrote unsigned build-profile.json5 (signingConfigs empty)"

      # ---- 兜底: 确保预构建 buildenv 含当前源码所需工具 ----
      # libltdl-dev 是 Wine 依赖; glslangValidator 是 DXVK 配置阶段生成
      # 内置 SPIR-V 的硬依赖; gettext (msgfmt) 是 Wine po 翻译资源硬依赖
      # (build_wine.sh 缺失即 exit 1); curl/wget 供构建期下载 (mono msi 等);
      # mingw-w64-tools 提供 VKD3D meson 需要的 widl.
      # Dockerfile 已同步声明, 镜像更新后这里 no-op.
      - name: Ensure CI build dependencies present
        run: |
          packages=()
          if [ ! -f /usr/share/aclocal/ltdl.m4 ]; then
            packages+=(libltdl-dev)
          fi
          if ! command -v glslangValidator >/dev/null 2>&1; then
            packages+=(glslang-tools)
          fi
          if ! command -v msgfmt >/dev/null 2>&1; then
            packages+=(gettext)
          fi
          if ! command -v curl >/dev/null 2>&1; then
            packages+=(curl)
          fi
          if ! command -v wget >/dev/null 2>&1; then
            packages+=(wget)
          fi
          # makeinfo (texinfo): gmp make all 会重新生成 doc/gmp.info,
          # 干净 checkout 时间戳旧必触发, 缺则 deps 阶段 Error 127
          if ! command -v makeinfo >/dev/null 2>&1; then
            packages+=(texinfo)
          fi
          if ! command -v x86_64-w64-mingw32-widl >/dev/null 2>&1; then
            packages+=(mingw-w64-tools)
          fi
          # xz-utils: 解压 llvm-mingw .tar.xz (见下方 Prepare llvm-mingw step)
          if ! command -v xz >/dev/null 2>&1; then
            packages+=(xz-utils)
          fi
          # gcc-aarch64-linux-gnu: box64 wow64 (wowbox64) 顶层 configure 的
          # C 编译器, build_box64_wow64.sh 硬依赖
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            packages+=(gcc-aarch64-linux-gnu)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing CI packages: ${packages[*]}"
            apt-get update
            apt-get install -y --no-install-recommends "${packages[@]}"
          else
            echo "CI build dependencies already present"
          fi

      # ---- llvm-mingw (arm64ec/aarch64 PE 编译 + FEX/wowbox64 构建, 需 LLVM ≥ 18) ----
      # buildenv 镜像暂未内置: 下载官方 release 到 .temp/ 并导出 LLVM_MINGW
      # (scripts/env.sh 优先采用该环境变量). 镜像内置 (ENV LLVM_MINGW) 后
      # 本 step 自动 no-op.
      - name: Prepare llvm-mingw toolchain
        run: |
          set -euo pipefail
          version=20260826
          name="llvm-mingw-${version}-ucrt-ubuntu-22.04-x86_64"
          if [ -x "${LLVM_MINGW:-}/bin/arm64ec-w64-mingw32-clang" ]; then
            echo "llvm-mingw already present: $LLVM_MINGW"
            "$LLVM_MINGW/bin/arm64ec-w64-mingw32-clang" --version | head -1
            exit 0
          fi
          dest="$GITHUB_WORKSPACE/.temp/$name"
          if [ ! -x "$dest/bin/arm64ec-w64-mingw32-clang" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.temp"
            curl -fL --retry 3 --connect-timeout 30 \
              -o "$GITHUB_WORKSPACE/.temp/$name.tar.xz" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/${name}.tar.xz"
            tar -xJf "$GITHUB_WORKSPACE/.temp/$name.tar.xz" -C "$GITHUB_WORKSPACE/.temp"
            rm "$GITHUB_WORKSPACE/.temp/$name.tar.xz"
          fi
          for tool in arm64ec-w64-mingw32-clang aarch64-w64-mingw32-clang \
                      aarch64-w64-mingw32-dlltool aarch64-w64-mingw32-strip llvm-readobj; do
            test -x "$dest/bin/$tool"
          done
          echo "LLVM_MINGW=$dest" >> "$GITHUB_ENV"
          "$dest/bin/arm64ec-w64-mingw32-clang" --version | head -1

      - name: Show environment
        run: |
          echo "== toolchain =="
          gcc --version | head -1
          cmake --version | head -1
          meson --version
          ninja --version
          python3 --version
          glslangValidator --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1
          i686-w64-mingw32-g++ --version | head -1
          x86_64-w64-mingw32-widl -V | head -1
          java -version 2>&1 | head -1
          echo "== OHOS SDK =="
          ls /apps/harmony/sdk/default/openharmony/native/llvm/bin/clang
          /apps/harmony/bin/hvigorw --version || true
          echo "== nproc =="
          nproc

      # 先单独构建两个 DXVK runtime 再打 HAP。这样 Modern 的交叉编译失败
      # 不会被误报为通用 HAP 打包失败；assemble 仍以它们为硬依赖。
      - name: Build DXVK Legacy runtime (x64 + x86)
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a dxvk
          for dll in \
            build/dxvk/legacy/x64/bin/d3d11.dll \
            build/dxvk/legacy/x64/bin/dxgi.dll \
            build/dxvk/legacy/x86/bin/d3d11.dll \
            build/dxvk/legacy/x86/bin/dxgi.dll; do
            test -s "$dll"
          done
          file build/dxvk/legacy/x64/bin/d3d11.dll \
               build/dxvk/legacy/x64/bin/dxgi.dll \
               build/dxvk/legacy/x86/bin/d3d11.dll \
               build/dxvk/legacy/x86/bin/dxgi.dll
          sha256sum build/dxvk/legacy/{x64,x86}/bin/{d3d11,dxgi}.dll

      - name: Build DXVK Modern runtime (x64 + x86)
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a dxvk-modern
          for dll in \
            build/dxvk/modern-2.6/x64/bin/d3d11.dll \
            build/dxvk/modern-2.6/x64/bin/dxgi.dll \
            build/dxvk/modern-2.6/x86/bin/d3d11.dll \
            build/dxvk/modern-2.6/x86/bin/dxgi.dll; do
            test -s "$dll"
          done
          file build/dxvk/modern-2.6/x64/bin/d3d11.dll \
               build/dxvk/modern-2.6/x64/bin/dxgi.dll \
               build/dxvk/modern-2.6/x86/bin/d3d11.dll \
               build/dxvk/modern-2.6/x86/bin/dxgi.dll
          sha256sum build/dxvk/modern-2.6/{x64,x86}/bin/{d3d11,dxgi}.dll

      - name: Build VKD3D-Proton runtime (x64 limited-500K)
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a vkd3d-proton
          for artifact in \
            build/vkd3d-proton/limited-500k/x64/d3d12.dll \
            build/vkd3d-proton/limited-500k/x64/winehua-d3d12-smoke.exe \
            build/vkd3d-proton/limited-500k/x64/triangle.exe \
            build/vkd3d-proton/limited-500k/x64/gears.exe \
            build/vkd3d-proton/limited-500k/manifest.json; do
            test -s "$artifact"
          done
          file build/vkd3d-proton/limited-500k/x64/d3d12.dll \
               build/vkd3d-proton/limited-500k/x64/winehua-d3d12-smoke.exe \
               build/vkd3d-proton/limited-500k/x64/triangle.exe \
               build/vkd3d-proton/limited-500k/x64/gears.exe
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/vkd3d-proton/limited-500k/manifest.json").read_text())
          assert manifest["profile"] == "limited-500k", manifest
          print("[vkd3d] profile=%s commit=%s" % (manifest["profile"], manifest["upstreamCommit"]))
          PY

      - name: Build HAP
        env:
          NATIVE_ARCH: arm64-v8a
          BUILD_GUEST_GFX: '1'
          BUILD_GUEST_VULKAN: '1'
          # CI 默认开启 mono: build_deps 用 curl/wget 下载 wine-mono-11.1.0
          # msi (~80MB, 镜像已备下载工具), assemble.sh 打包 cpl + mono msi —
          # 产物完整支持 .NET 应用/控制面板. 设 BUILD_WINE_MONO: '0' 可关闭
          # (无网络/精简产物时用).
          BUILD_WINE_MONO: '1'
        run: |
          set -euxo pipefail
          make NATIVE_ARCH=arm64-v8a hap

      - name: Locate artifacts
        id: art
        run: |
          set -eux
          out_dir=entry/build/default/outputs/default
          ls -lh "$out_dir"
          if [ -f "$out_dir/entry-default-unsigned.hap" ]; then
            echo "hap=$out_dir/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          else
            echo "hap=$out_dir/entry-default-signed.hap" >> "$GITHUB_OUTPUT"
          fi

      # PE 构建成功不代表产物完整: 校验 HAP 内嵌 wine-data.zip 中的运行时
      # DLL 与 submodule 实际 commit 一致, 防止陈旧 staging 或错误架构的
      # 产物在发布前未被发现.
      - name: Verify embedded runtime in HAP
        env:
          HAP_PATH: ${{ steps.art.outputs.hap }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import struct
          import subprocess
          import zipfile

          hap_path = os.environ["HAP_PATH"]
          expected_runtimes = {
              "legacy": {
                  "version": "1.10.3",
                  "commit": subprocess.check_output(
                      ["git", "-C", "thirdparty/dxvk", "rev-parse", "HEAD"], text=True
                  ).strip(),
              },
              "modern-2.6": {
                  "version": "2.6.2",
                  "commit": subprocess.check_output(
                      ["git", "-C", "thirdparty/dxvk-modern", "rev-parse", "HEAD"], text=True
                  ).strip(),
              },
          }

          with zipfile.ZipFile(hap_path) as hap:
              payload = hap.read("resources/rawfile/wine-data.zip")
              runtime_manifest = json.loads(
                  hap.read("resources/rawfile/wine-runtime-manifest.json")
              )

          payload_sha = hashlib.sha256(payload).hexdigest()
          assert runtime_manifest["payloadSha256"] == payload_sha, (
              runtime_manifest["payloadSha256"], payload_sha
          )

          with zipfile.ZipFile(io.BytesIO(payload)) as wine_data:
              dxvk_manifest = json.loads(wine_data.read("dxvk/manifest.json"))
              assert dxvk_manifest["schemaVersion"] == 2
              assert dxvk_manifest["backend"] == "dxvk"
              assert dxvk_manifest["defaultProfile"] == "legacy"
              runtimes = dxvk_manifest["runtimes"]
              assert set(runtimes) == set(expected_runtimes), runtimes.keys()

              for profile, expected in expected_runtimes.items():
                  runtime = runtimes[profile]
                  assert runtime["version"] == expected["version"], runtime
                  assert runtime["commit"] == expected["commit"], (
                      profile, runtime["commit"], expected["commit"]
                  )
                  assert runtime["state"], (profile, runtime)
                  assert isinstance(runtime["requiredCapabilities"], dict), runtime
                  for arch, expected_machine in (("x64", 0x8664), ("x86", 0x014C)):
                      for dll in ("d3d11.dll", "dxgi.dll"):
                          name = f"dxvk/{profile}/{arch}/{dll}"
                          image = wine_data.read(name)
                          assert len(image) > 4096, (name, len(image))
                          assert image[:2] == b"MZ", name
                          pe_offset = struct.unpack_from("<I", image, 0x3C)[0]
                          assert image[pe_offset:pe_offset + 4] == b"PE\0\0", name
                          machine = struct.unpack_from("<H", image, pe_offset + 4)[0]
                          assert machine == expected_machine, (
                              name, hex(machine), hex(expected_machine)
                          )
                          assert runtime[arch][dll] == hashlib.sha256(image).hexdigest(), name
                          print(
                              f"[dxvk/{profile}] {name}: "
                              f"machine={machine:#06x} size={len(image)}"
                          )

              # 仅 PE DLL 在 ARM64 HarmonyOS 上不可运行, 需同 payload 内的
              # Vulkan 依赖链文件齐全才能工作, 一并校验.
              vulkan_runtime = (
                  "bin/x86_64-windows/vulkan-1.dll",
                  "bin/i386-windows/vulkan-1.dll",
                  "bin/x86_64-unix/winevulkan.so",
                  "bin/guest_vulkan/lib/libvulkan.so.1",
                  "bin/guest_vulkan/lib/libvulkan_virtio.so",
                  "bin/guest_vulkan/share/vulkan/icd.d/venus_icd.x86_64.json",
              )
              for name in vulkan_runtime:
                  image = wine_data.read(name)
                  assert image, name
                  print(f"[vulkan] {name}: size={len(image)}")

              vkd3d_manifest = json.loads(wine_data.read("vkd3d/manifest.json"))
              assert vkd3d_manifest["profile"] == "limited-500k", vkd3d_manifest
              vkd3d_commit = subprocess.check_output(
                  ["git", "-C", "thirdparty/vkd3d-proton", "rev-parse", "HEAD"],
                  text=True,
              ).strip()
              assert vkd3d_manifest["upstreamCommit"] == vkd3d_commit, (
                  vkd3d_manifest["upstreamCommit"], vkd3d_commit
              )
              for name, expected_machine in (
                  ("vkd3d/limited-500k/x64/d3d12.dll", 0x8664),
                  ("smoke/x64/winehua_d3d12_smoke.exe", 0x8664),
                  ("smoke/x64/triangle.exe", 0x8664),
                  ("smoke/x64/gears.exe", 0x8664),
              ):
                  image = wine_data.read(name)
                  assert len(image) > 4096, (name, len(image))
                  assert image[:2] == b"MZ", name
                  pe_offset = struct.unpack_from("<I", image, 0x3C)[0]
                  assert image[pe_offset:pe_offset + 4] == b"PE\0\0", name
                  machine = struct.unpack_from("<H", image, pe_offset + 4)[0]
                  assert machine == expected_machine, (
                      name, hex(machine), hex(expected_machine)
                  )
                  print(f"[vkd3d] {name}: machine={machine:#06x} size={len(image)}")
              print(f"[vkd3d] commit={vkd3d_commit}")

          for profile, expected in expected_runtimes.items():
              print(f"[dxvk/{profile}] commit={expected['commit']}")
          print(f"[dxvk] wine-data.zip sha256={payload_sha}")
          PY

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: WineHua-arm64-v8a-unsigned-${{ github.sha }}
          path: ${{ steps.art.outputs.hap }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/**/meson-logs/**
            build/**/CMakeFiles/CMakeOutput.log
            build/**/CMakeFiles/CMakeError.log
            build/**/config.log
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # Release job: 仅在推 tag 或手动指定 release_tag 时运行
  # ============================================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/dev-') || startsWith(github.ref, 'refs/tags/rc-') || github.event.inputs.release_tag != ''

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要历史 commit 生成 changelog

      - name: Determine release tag & Latest ownership
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Latest 徽章归属: rc-* 占, dev-* 不占
          # (GitHub 规则: prerelease 不能是 latest, 故两种 tag 均不标 pre,
          #  由 make_latest 参数控制 Latest 徽章)
          case "$tag" in
            dev-*) make_latest=false ;;
            *)     make_latest=true ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag (make_latest=$make_latest)"

      - name: Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: WineHua-arm64-v8a-unsigned-${{ github.sha }}
          path: ./release-assets

      - name: Rename artifact with version
        run: |
          set -eux
          cd release-assets
          for f in *.hap; do
            mv "$f" "WineHua-${{ steps.tag.outputs.tag }}-arm64-v8a-unsigned.hap"
          done
          ls -lh

      - name: Generate changelog
        run: |
          # 按频道找上一个同类 tag (dev→dev, rc→rc, v→v): 各频道 changelog
          # 只相对自己上一版统计, 避免 dev 频繁构建把 rc/v 的变更列表切碎。
          # 注意 git describe 只沿祖先链找 — 同频道 tag 须在同一分支线上
          tag="${{ steps.tag.outputs.tag }}"
          case "$tag" in
            dev-*) match='dev-*' ;;
            rc-*)  match='rc-*' ;;
            v*)    match='v*' ;;
            *)     match='*' ;;
          esac
          prev_tag=$(git describe --tags --abbrev=0 --match "$match" "${tag}^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            {
              echo "## Changes since \`$prev_tag\`"
              echo
              git log --pretty=format:'- %s (%h)' "$prev_tag..${{ steps.tag.outputs.tag }}"
            } > changelog.md
          else
            echo "## Initial release" > changelog.md
          fi
          {
            echo
            echo
            echo "---"
            echo
            echo "**Note**: This build is **unsigned**. To install on a HarmonyOS device you'll need developer mode enabled, or sign the HAP with your own certificate first."
            echo
            echo "Built from commit \`${GITHUB_SHA:0:7}\`."
          } >> changelog.md
          echo "---- changelog.md ----"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: WineHua ${{ steps.tag.outputs.tag }}
          body_path: changelog.md
          files: release-assets/*.hap
          draft: false
          # dev-*/rc-* 均不标 pre-release (GitHub 规则: prerelease 不能是 latest)
          prerelease: false
          # Latest 徽章: rc-* 占, dev-* 不占
          make_latest: ${{ steps.tag.outputs.make_latest }}
          fail_on_unmatched_files: true
